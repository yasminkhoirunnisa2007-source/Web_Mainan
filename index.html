<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Toko Mainan Anak</title>

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="#beranda" aria-label="WonderPlay Toys">
        <span class="brand-mark">W</span>
        <span>Toko Mainan Obet</span>
      </a>

      <button
        class="nav-toggle"
        type="button"
        aria-label="Buka menu"
        aria-expanded="false"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>

      <nav class="site-nav" aria-label="Navigasi utama">
        <a href="#produk">Produk</a>
        <a href="#promo">Promo</a>
        <a href="#tentang">Tentang</a>
        <a href="#kontak">Kontak</a>
      </nav>
    </header>

    <main>
      <section id="beranda" class="hero">
        <div
          class="hero-media"
          role="img"
          aria-label="Foto anak-anak bermain mainan di ruang bermain"
        ></div>

        <div class="hero-content">
          <p class="eyebrow">Toko mainan keluarga sejak 2016</p>

          <h1>Toko Mainan Obet</h1>

          <p class="hero-copy">
            Mainan edukatif, kreatif, dan aman untuk menemani anak belajar lewat
            rasa ingin tahu.
          </p>

          <div class="hero-actions">
            <a class="button primary" href="#"> Lihat Katalog </a>

            <a class="button secondary" href="#"> Pesan Sekarang </a>
          </div>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
